; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Sin -e, "pio run" y el boton de subir solo construyen el ESP32.
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs

; El servidor asíncrono moderno usa C++17; el core de Arduino compila con C++11 por defecto.
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-Wall
	-DLOG_LEVEL=3

lib_deps =
	esp32async/ESPAsyncWebServer@^3.12.1
	esp32async/AsyncTCP@^3.5.0
	bblanchon/ArduinoJson@^7.2.2
	miguelbalboa/MFRC522@^1.4.12
	madhephaestus/ESP32Servo@^3.2.1
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/DHT sensor library@^1.4.4

; ESPAsyncWebServer declara dependencias para ESP8266 y RP2040; en ESP32 no compilan.
lib_ignore =
	ESPAsyncTCP
	RPAsyncTCP

; Pruebas unitarias de la lógica pura (sin hardware) en la PC:
;   pio test -e native
; Requiere un compilador de C++ en la PC (gcc/MinGW). Es opcional.
[env:native]
platform = native
build_flags = -std=gnu++17
test_framework = unity
lib_ignore =
	WifiManager
	ApiServer
	GateModule
	DistanceSensor
	Buzzer
